<script>
// Only reached when the app's palette was never painted by the <head> script.
function readLockPaletteCache() { return null; }

// ── Lock-screen intro ────────────────────────────────────────────────────
// Mara's sequence rebuilt without GSAP. Theirs is declarative — JS reads
// data-animation="stagger-bottom" and builds timelines, with Flip carrying
// the wordmark into the header. None of that needs a library here: stagger
// is animation-delay per character, the colour walk is a background-color
// transition, and the wordmark settles into its own resting place rather
// than flying anywhere, so there is no Flip to replace.

const LOCK_COLOURS = ['#1f2b3a', '#4a4f36', '#5c2230'];   // navy, olive, wine

// Steps to the next colour per load. Deliberately not random: cycling makes
// each reload visibly different, where random repeats itself often enough to
// look broken.
function _lockColour() {
  // Already chosen and painted by the <head> script, which has to run before
  // first paint so iOS samples the right ground for the status-bar strip.
  // Reuse it — stepping the cycle again here would advance it twice per load
  // and, worse, hand the intro a different colour than the one already on the
  // root, putting a mismatched band back across the top.
  if (window.__lockColour) return window.__lockColour;
  // Fallback for when that script could not run. Read synchronously from
  // localStorage, not the server: awaiting a fetch here would either flash a
  // default colour first or delay the intro. The cache is refreshed in the
  // background after unlock (refreshLockPaletteCache), so an edit made on
  // another device lands on the next load. Falls back to the built-in triple
  // when nothing is cached or the cached value is malformed.
  const palette = readLockPaletteCache() || LOCK_COLOURS;
  const n = (Number(localStorage.getItem('lock_col_n') || 0) + 1) % palette.length;
  localStorage.setItem('lock_col_n', String(n));
  return palette[n];
}

// The intro card's colour, chosen by the <head> script before first paint so
// the root already matches it. Reused, never re-stepped here (that would
// advance the alternation twice per load). Fallback only if that script
// could not run.
function _lockShotColour() {
  if (window.__lockShot) return window.__lockShot;
  let m = 1;
  try {
    m = (Number(localStorage.getItem('lock_shot_n') || 0) + 1) % 2;
    localStorage.setItem('lock_shot_n', String(m));
  } catch (e) {}
  return (window.__lockShot = m ? '#111014' : '#f4f2ee');
}

// Mean colour of the image: its luminance picks the ink, and the colour
// itself paints the root element (see _lockPaintRoot). Wrapped because a
// cross-origin photo taints the canvas and throws.
function _lockShotMean(img) {
  try {
    const c = document.createElement('canvas');
    c.width = c.height = 16;
    const ctx = c.getContext('2d');
    ctx.drawImage(img, 0, 0, 16, 16);
    const d = ctx.getImageData(0, 0, 16, 16).data;
    let r = 0, g = 0, b = 0;
    const n = d.length / 4;
    for (let i = 0; i < d.length; i += 4) { r += d[i]; g += d[i + 1]; b += d[i + 2]; }
    r /= n; g /= n; b /= n;
    return {
      css: `rgb(${Math.round(r)}, ${Math.round(g)}, ${Math.round(b)})`,
      dark: (0.2126 * r + 0.7152 * g + 0.0722 * b) < 128
    };
  } catch (e) { return null; }
}

// #pin-lock is position:fixed, which on iOS Safari briefly under-covers while
// the URL bar collapses and during rubber-band overscroll. What shows through
// at those edges is the root background — transparent by default, so the
// dashboard's grey leaked past the lock screen. Painting the root the same
// colour makes the gap invisible whether or not it happens.
function _lockPaintRoot(colour) {
  document.documentElement.style.backgroundColor = colour || '';
}

// PROTECTED — the lock-screen intro must never be removed, hidden or
// disabled. See CLAUDE.md "Lock-screen intro animation" for why and for the
// invariants below.
//
// One timer list shared by every run. A re-lock can restart the intro while
// an earlier run is still pending (logout within ~4s of opening); with a
// per-run list the old run's timers kept firing into the new one, bringing
// the card in early and revealing the keypad mid-animation.
const _lockIntroTimers = [];

function runLockIntro() {
  _lockIntroTimers.splice(0).forEach(clearTimeout);
  const lock   = document.getElementById('pin-lock');
  const title  = document.querySelector('.pin-title');
  const shot   = document.querySelector('.pin-shot');
  const canvas = document.querySelector('.pin-canvas');
  if (!lock || !title || !shot || !canvas) return;
  if (lock.classList.contains('hidden')) return;

  // A replay (re-lock after logout) arrives with the card still full-screen
  // from the last run. Just dropping its classes lets the transitions play in
  // reverse — the card visibly fading and shrinking for ~1s while the new
  // intro starts. Snap it to its hidden start state for one frame instead.
  lock.classList.add('no-anim');
  lock.classList.remove('shot-in', 'shot-full');
  void lock.offsetWidth;
  lock.classList.remove('no-anim');

  // Split the wordmark into per-character spans. Spaces get their own span
  // (white-space:pre in the CSS) so the cascade stays evenly timed.
  const text = title.textContent;
  title.textContent = '';
  [...text].forEach((ch, i) => {
    const s = document.createElement('span');
    s.className = 'ch';
    s.style.setProperty('--i', String(i));
    s.textContent = ch;
    title.appendChild(s);
  });
  // Both are chosen before the first paint and never change during the visit.
  const colour = _lockColour();
  const shotColour = _lockShotColour();
  const shotDark = shotColour === '#111014';
  canvas.style.backgroundColor = colour;
  shot.style.backgroundColor = shotColour;
  // Root = the card's colour, matching the <head> paint (the resting screen
  // is the card, full-bleed, for as long as the PIN is being typed).
  _lockPaintRoot(shotColour);

  const timers = _lockIntroTimers;

  // Two halves, deliberately on different beats.
  //
  // The ink runs *with* the zoom: --lock-ink flips as the card expands, and
  // .pin-title carries a colour transition matched to the zoom's duration, so
  // the wordmark turns while the card moves rather than after it stops.
  // Light ink on the black card, dark ink on the off-white one.
  const landInk = () => lock.classList.toggle('on-dark', shotDark);
  // The backdrop does not. Repainting .pin-canvas mid-zoom is visible — the
  // card is still smaller than the screen, so the colour change shows around
  // it and reads as a bug. This runs at the end, behind the fully-expanded
  // card, so the compositing seam at the safe-area edges (notch / Dynamic
  // Island) reveals a matching colour rather than the staging one.
  const landGround = () => {
    _lockPaintRoot(shotColour);
    canvas.style.backgroundColor = shotColour;
  };

  // End of the choreography. Must not run before the zoom has finished: it
  // reveals the controls, so firing it mid-zoom pops them in while the image
  // is still visibly moving — which reads as the last second being skipped.
  // landInk() normally already ran on the zoom beat; it stays here because
  // jump() (reduced motion, see below) skips that beat entirely, and it is
  // idempotent — re-applying the same colours transitions to where they are.
  const finish = () => {
    timers.splice(0).forEach(clearTimeout);
    lock.classList.remove('staging');
    lock.classList.add('shot-in', 'shot-full');
    landInk();
    landGround();
  };

  // Cutting to the end — reduced motion, or a tap partway through. Adding
  // shot-full on its own would start the 1.2s zoom from wherever the image
  // currently sits, so the expansion appeared to race at random. Suppressing
  // transitions for one frame makes the jump land instantly instead.
  const jump = () => {
    lock.classList.add('no-anim');
    finish();
    void lock.offsetWidth;              // commit the frame before re-enabling
    lock.classList.remove('no-anim');
  };

  // Plays on every load. An earlier version gated it to once per session,
  // but sessionStorage survives reloads — so the first load animated and
  // every reload after silently took the skip path, which read as the intro
  // randomly breaking. Predictable beats clever here. Reduced motion still
  // cuts straight to the resting state.
  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    title.querySelectorAll('.ch').forEach(c => { c.style.animation = 'none'; });
    jump();
    return;
  }

  // One colour for the whole visit, chosen before anything is painted. It
  // steps to the next on each load rather than cycling on screen — a backdrop
  // that changes while you are looking at it reads as a glitch, not a design.
  // All three are dark, so the ink starts light and only changes when the
  // card expands — to dark ink if this load's card is the off-white one.
  lock.classList.add('staging', 'on-dark');

  const at = (ms, fn) => timers.push(setTimeout(fn, ms));
  at(2150, () => lock.classList.add('shot-in'));
  // Ink turns on the same beat the zoom starts, and over the same 1.2s, so
  // the wordmark recolours *while* the photo expands. It used to happen only
  // in finish(), after everything had stopped moving, which read as the screen
  // recolouring itself a beat late.
  at(2550, () => { lock.classList.add('shot-full'); landInk(); });
  // 2550 + the 1.2s transform transition on .pin-shot. These two numbers must
  // stay in step: an earlier version finished at 2950, cutting the zoom 800ms
  // short and snapping the whole screen to its end state while it was still
  // moving. If the CSS duration changes, change this with it.
  at(3750, finish);

  // No skip-on-tap. An earlier version cut to the end state on any touch or
  // keypress so PIN entry never waited on choreography — but the sequence is
  // under three seconds and touching the screen to watch it should not
  // destroy it. The staged controls are pointer-inert instead, so a stray tap
  // lands on nothing rather than on an invisible key.
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', runLockIntro);
} else {
  runLockIntro();
}

// ── Preview wiring (not part of the app) ────────────────────────────────
// Dummy keypad: fills the dots, then clears them. No PIN is checked or sent.
let _pin = '';
function _pinDots() {
  for (let i = 0; i < 4; i++) document.getElementById('pd' + i).classList.toggle('filled', i < _pin.length);
}
function pinKey(d) {
  if (_pin.length >= 4) return;
  _pin += d; _pinDots();
  if (_pin.length === 4) setTimeout(() => { _pin = ''; _pinDots(); }, 450);
}
function pinDel() { _pin = _pin.slice(0, -1); _pinDots(); }

function previewPlay() {
  const lock = document.getElementById('pin-lock');
  lock.classList.add('no-anim');
  lock.classList.remove('hidden');
  void lock.offsetWidth;
  lock.classList.remove('no-anim');
  runLockIntro();
}
// The PIN types itself: each key lights as it is pressed and its dot fills,
// then the dots breathe until the visitor moves on. Display only — the
// digits go nowhere.
const _autoTimers = [];
function previewAutotype() {
  _autoTimers.splice(0).forEach(clearTimeout);
  _pin = ''; _pinDots();
  const dots = document.querySelector('.pin-dots');
  dots.classList.remove('waiting');
  const keys = [...document.querySelectorAll('.pin-key')];
  const press = d => keys.find(k => k.textContent.trim() === d);
  let t = 450;
  ['2', '7', '0', '4'].forEach(d => {
    _autoTimers.push(setTimeout(() => { const k = press(d); k.classList.add('auto-press'); _pin += d; _pinDots(); }, t));
    _autoTimers.push(setTimeout(() => press(d).classList.remove('auto-press'), t + 150));
    t += 300 + Math.round(Math.random() * 120);
  });
  _autoTimers.push(setTimeout(() => dots.classList.add('waiting'), t + 200));
}

function previewReset() {
  _autoTimers.splice(0).forEach(clearTimeout);
  document.querySelector('.pin-dots').classList.remove('waiting');
  document.querySelectorAll('.pin-key.auto-press').forEach(k => k.classList.remove('auto-press'));
  const lock = document.getElementById('pin-lock');
  _lockIntroTimers.splice(0).forEach(clearTimeout);
  lock.classList.add('no-anim', 'hidden');
  lock.classList.remove('staging', 'shot-in', 'shot-full');
  void lock.offsetWidth;
  lock.classList.remove('no-anim');
  _pin = ''; _pinDots();
}
window.addEventListener('message', (e) => {
  if (e.origin !== location.origin) return;
  if (e.data === 'ohlcv:play') previewPlay();
  else if (e.data === 'ohlcv:reset') previewReset();
  else if (e.data === 'ohlcv:autotype') previewAutotype();
});
// Tell the home page when the intro has landed on the keypad, so it can
// cover the screen with the demo prompt. Watched from outside (the class
// finish() sets) rather than by changing the copied intro.
(function () {
  const lock = document.getElementById('pin-lock');
  let told = false;
  new MutationObserver(() => {
    const done = !lock.classList.contains('hidden') && !lock.classList.contains('staging')
      && lock.classList.contains('shot-full');
    if (done && !told && window.parent !== window) parent.postMessage('ohlcv:intro-done', location.origin);
    told = done;
  }).observe(lock, { attributes: true, attributeFilter: ['class'] });
})();
// Opened on its own rather than inside the laptop: play straight away.
if (window.parent === window) previewPlay();
</script>
