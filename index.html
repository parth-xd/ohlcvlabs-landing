<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2e9e0">
    <meta name="description" content="OHLCV Labs — proprietary trading algorithms built on quantitative research and machine learning.">
    <link rel="canonical" href="https://ohlcvlabs.studio/">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <link rel="icon" href="/favicon.ico" sizes="any">
    <link rel="apple-touch-icon" href="/apple-touch-icon.png">
    <title>OHLCV Labs</title>
    <style>
        :root {
            --ground: #f2e9e0;
            --ink:    #0a0a0a;
            --mute:   #1e1d20;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; background: var(--ground); }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--ground);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ── Page ─────────────────────────────────────────────────────── */
        /* Nav pinned top-right, wordmark block centred vertically and hung
           off the same left margin. Both use --gutter so they stay optically
           aligned at every width. */
        .page {
            --gutter: clamp(22px, 8.5vw, 190px);
            position: relative;
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 var(--gutter);
        }

        .nav {
            position: absolute;
            top: clamp(18px, 3.4vh, 40px);
            right: var(--gutter);
            display: flex;
            align-items: center;
            gap: clamp(10px, 1vw, 16px);
            font-size: clamp(11px, 0.92vw, 16px);
            font-weight: 500;
            letter-spacing: 0.11em;
            text-transform: uppercase;
        }

        .nav a {
            color: var(--ink);
            text-decoration: none;
            /* Tap target without visibly padding the text: the nav sits tight
               to the corner and 44px of real padding would push it off-centre. */
            padding: 10px 2px;
            transition: opacity .25s ease;
        }
        .nav a:hover, .nav a:focus-visible { opacity: .45; }

        .nav .sep { width: 1px; height: 1em; background: currentColor; opacity: .65; }

        h1 {
            font-size: clamp(38px, 7.4vw, 152px);
            font-weight: 800;
            letter-spacing: -.035em;
            line-height: .95;
            color: var(--ink);
        }

        .tagline {
            margin-top: clamp(10px, 1.5vh, 22px);
            /* Tied to the wordmark rather than the viewport: the two scale
               together, so the pairing holds from a phone to a large display. */
            font-size: clamp(14px, 1.72vw, 35px);
            font-weight: 700;
            letter-spacing: -.005em;
            color: var(--mute);
        }

        /* Everything except the wordmark waits: during the intro the screen
           holds one thing, the way the dashboard's lock screen does. */
        .nav, .tagline { transition: opacity .7s cubic-bezier(.215,.61,.355,1); }
        body.intro-running .nav,
        body.intro-running .tagline { opacity: 0; pointer-events: none; }

        /* Per-character drop, on the real headline in its real position.
           --i is the character index, set when the wordmark is split; 45ms
           apart reads as a cascade without dragging. Splitting disables the
           font's pair kerning — at this weight and size the loss is not
           visible, so no per-pair correction is carried over from the
           dashboard (those values were measured for "OHLCV" alone and do not
           transfer to this wordmark). */
        @keyframes chDrop {
            from { opacity: 0; transform: translateY(-108%); }
            to   { opacity: 1; transform: none; }
        }
        h1 .ch {
            display: inline-block;
            white-space: pre;
            animation: chDrop .8s cubic-bezier(.215,.61,.355,1) both;
            animation-delay: calc(var(--i) * 45ms);
        }

        @media (prefers-reduced-motion: reduce) {
            h1 .ch { animation: none; }
            .nav, .tagline { transition: none; }
        }

    </style>
</head>
<body class="intro-running">
    <div class="page">
        <nav class="nav">
            <a href="/login/">Login</a>
            <span class="sep" aria-hidden="true"></span>
            <a href="/services/">Services</a>
        </nav>

        <main>
            <h1>OHLCV LABS.</h1>
            <p class="tagline">Proprietary trading algorithms</p>
        </main>
    </div>

<script>
/* Intro: the wordmark's letters drop into the positions they keep; the nav
   and tagline arrive as the last letter lands. */
function runIntro() {
  const title = document.querySelector('h1');
  const finish = () => document.body.classList.remove('intro-running');
  if (!title) { finish(); return; }   // never trap the page

  // Spaces get their own span (white-space:pre in the CSS) so the cascade stays evenly timed.
  const text = title.textContent;
  title.textContent = '';
  [...text].forEach((ch, i) => {
    const s = document.createElement('span');
    s.className = 'ch';
    s.style.setProperty('--i', String(i));
    s.textContent = ch;
    title.appendChild(s);
  });

  const last = title.lastElementChild;
  if (!last || matchMedia('(prefers-reduced-motion: reduce)').matches) { finish(); return; }

  // Timed off the CSS itself (last letter's delay + duration), so the two can't drift apart.
  const cs = getComputedStyle(last);
  setTimeout(finish, (parseFloat(cs.animationDelay) + parseFloat(cs.animationDuration)) * 1000);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', runIntro);
} else {
  runIntro();
}
</script>
</body>
</html>
