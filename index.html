<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="theme-color" content="#f2e9e0">
    <!-- Private for now: search engines are told to stay out until the site
         is meant to be found. Same rule as the sign-in page at /login/.
         Remove from BOTH when it should be findable. -->
    <meta name="robots" content="noindex">
    <title>OHLCV Labs</title>
<script>
/* Intro colours, chosen before the first paint.

   Mirrors the dashboard PIN screen's intro (index.html, PROTECTED there —
   this is a separate copy for a separate site, not a shared module; changing
   one does not change the other). Two independent picks, each alternating /
   cycling per load so consecutive visits differ:
     backdrop  navy -> olive -> wine   (all dark; the wordmark starts light)
     box       black <-> off-white     (the "black and white" beat)

   The root is deliberately left CREAM rather than painted the box colour.
   iOS samples the status-bar strip once at first paint and never re-samples,
   so painting it black would leave a black strip above a cream page for the
   whole visit — the intro is 3.75s, the resting page is everything after it,
   and the strip should match the latter. The dark backdrop is supplied by a
   full-screen overlay instead, which covers the cream without changing what
   iOS sampled. Storage keys are this site's own, so they never step the
   dashboard's sequence. */
(function () {
  var GROUNDS = ['#1f2b3a', '#4a4f36', '#5c2230'];   // navy, olive, wine
  var ground = GROUNDS[0], box = '#111014';
  try {
    var g = (Number(localStorage.getItem('splash_ground_n') || 0) + 1) % GROUNDS.length;
    localStorage.setItem('splash_ground_n', String(g));
    ground = GROUNDS[g];
    var b = (Number(localStorage.getItem('splash_box_n') || 0) + 1) % 2;
    localStorage.setItem('splash_box_n', String(b));
    box = b ? '#111014' : '#f4f2ee';
  } catch (e) { /* storage blocked (private mode): navy + black every load */ }
  window.__splashGround = ground;
  window.__splashBox = box;
})();
</script>
    <style>
        :root {
            --ground: #f2e9e0;
            --ink:    #0a0a0a;
            --mute:   #1e1d20;
            --light:  #f4f2ee;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html { scroll-behavior: smooth; background: var(--ground); }

        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Helvetica, Arial, sans-serif;
            background: var(--ground);
            color: var(--ink);
            min-height: 100vh;
            overflow-x: hidden;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }

        /* ── Resting page ──────────────────────────────────────────────── */
        /* Nav pinned top-right, wordmark block centred vertically and hung
           off the same left margin. Both use --gutter so they stay optically
           aligned at every width. */
        .page {
            --gutter: clamp(22px, 8.5vw, 190px);
            min-height: 100vh;
            min-height: 100dvh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            padding: 0 var(--gutter);
            opacity: 1;
            transition: opacity .6s cubic-bezier(.215,.61,.355,1);
        }
        body.intro-running .page { opacity: 0; }

        .nav {
            position: absolute;
            top: clamp(18px, 3.4vh, 40px);
            right: var(--gutter);
            display: flex;
            align-items: center;
            gap: clamp(10px, 1vw, 16px);
            font-size: clamp(11px, 0.92vw, 16px);
            font-weight: 500;
            letter-spacing: 0.11em;
            text-transform: uppercase;
        }

        .nav a {
            color: var(--ink);
            text-decoration: none;
            /* Tap target without visibly padding the text: the nav sits tight
               to the corner and 44px of real padding would push it off-centre. */
            padding: 10px 2px;
            transition: opacity .25s ease;
        }
        .nav a:hover, .nav a:focus-visible { opacity: .45; }

        .nav .sep { width: 1px; height: 1em; background: currentColor; opacity: .65; }

        /* Inert until the deck it will hold exists. Rendered like the live
           link on purpose — a real destination that is not built yet, not a
           disabled control. */
        .nav .pending { cursor: default; }
        .nav .pending:hover { opacity: 1; }

        h1 {
            font-size: clamp(38px, 7.4vw, 152px);
            /* Laid out from the start so land() can measure where the intro
               wordmark is travelling to; revealed only once it arrives. */
            font-weight: 800;
            letter-spacing: -.035em;
            line-height: .95;
            color: var(--ink);
        }

        .tagline {
            margin-top: clamp(10px, 1.5vh, 22px);
            /* Tied to the wordmark rather than the viewport: the two scale
               together, so the pairing holds from a phone to a large display. */
            font-size: clamp(14px, 1.72vw, 35px);
            font-weight: 700;
            letter-spacing: -.005em;
            color: var(--mute);
        }

        /* ── Intro overlay ─────────────────────────────────────────────── */
        /* Phases, driven by classes set in runIntro():
             staging    wordmark held centre-screen over the dark backdrop
             shot-in    the box fades up at .46 scale
             shot-full  the box expands to fill
             on-dark    ink is light, against a dark backdrop or a dark box
             done       the overlay fades out and the page fades in          */
        #intro {
            position: fixed;
            inset: 0;
            z-index: 10;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
            transition: opacity .6s cubic-bezier(.215,.61,.355,1);
        }
        #intro.done { pointer-events: none; }

        /* No transition on the backdrop on purpose: it is a fixed ground for
           one visit, not an effect. Set once, never moved. */
        .intro-canvas { position: absolute; inset: 0; z-index: 0; }

        .intro-box {
            /* A plain coloured block, never an image. The dashboard learned
               this the hard way: an <img> of a one-colour SVG data URI was
               refused by iOS WebKit and rendered as a grey box. A block
               cannot fail to load. Colour is set in runIntro(). */
            position: absolute;
            left: 50%; top: 50%;
            z-index: 1;
            width: 100%; height: 100%;
            opacity: 0;
            transform: translate(-50%,-50%) scale(.46);
            transition: opacity .7s cubic-bezier(.215,.61,.355,1),
                        transform 1.2s cubic-bezier(.215,.61,.355,1);
        }
        #intro.shot-in   .intro-box { opacity: 1; }
        #intro.shot-full .intro-box { transform: translate(-50%,-50%) scale(1); }

        /* Every type metric here is the resting h1's, deliberately. The
           wordmark does not cross-fade into place at the end — it travels
           there, and the travel is a pure translate measured at run time
           (see land()). Any difference in size, weight or tracking would
           have to be scaled away mid-flight, which softens the glyphs and
           makes the landing miss by a pixel or two. Keep these in step with
           h1: if one changes, change both. */
        .intro-title {
            position: relative;
            z-index: 2;
            display: inline-block;      /* shrink to the text, so its box IS the text */
            font-size: clamp(38px, 7.4vw, 152px);
            font-weight: 800;
            letter-spacing: -.035em;
            line-height: .95;
            color: var(--ink);
            transition: color 1.2s cubic-bezier(.215,.61,.355,1);
        }
        /* The flight. Same curve as the zoom it hands off from, so the two
           read as one movement rather than two. */
        #intro.landing .intro-title {
            transition: transform 1.15s cubic-bezier(.215,.61,.355,1),
                        color 1.15s cubic-bezier(.215,.61,.355,1);
        }
        /* The ground drops away while the wordmark travels over it. */
        #intro.landing .intro-canvas,
        #intro.landing .intro-box { opacity: 0; transition: opacity .85s cubic-bezier(.215,.61,.355,1); }
        #intro.on-dark .intro-title { color: var(--light); }

        /* Per-character drop. --i is the character index, set when the
           wordmark is split; 45ms apart reads as a cascade without dragging.
           Splitting disables the font's pair kerning — at this weight and
           size the loss is not visible, so no per-pair correction is carried
           over from the dashboard (those values were measured for "OHLCV"
           alone and do not transfer to this wordmark). */
        @keyframes chDrop {
            from { opacity: 0; transform: translateY(-108%); }
            to   { opacity: 1; transform: none; }
        }
        .intro-title .ch {
            display: inline-block;
            white-space: pre;
            animation: chDrop .8s cubic-bezier(.215,.61,.355,1) both;
            animation-delay: calc(var(--i) * 45ms);
        }

        /* Applied for a single frame whenever the sequence is jumped to its
           end state. Without it, adding shot-full starts the 1.2s zoom from
           wherever the box happens to be, and the expansion appears to race. */
        #intro.no-anim, #intro.no-anim * {
            transition: none !important;
            animation: none !important;
        }

        @media (prefers-reduced-motion: reduce) {
            .intro-title .ch { animation: none; }
            #intro, .intro-box, .intro-title, .page { transition: none; }
        }
    </style>
</head>
<body class="intro-running">
    <div class="page">
        <nav class="nav">
            <a href="/login/">Login</a>
            <span class="sep" aria-hidden="true"></span>
            <a class="pending" role="link" aria-disabled="true" title="Coming soon">Services</a>
        </nav>

        <main>
            <h1>OHLCV LABS.</h1>
            <p class="tagline">Proprietary trading algorithms</p>
        </main>
    </div>

    <div id="intro" aria-hidden="true">
        <div class="intro-canvas"></div>
        <div class="intro-box"></div>
        <div class="intro-title">OHLCV LABS.</div>
    </div>

<script>
/* Intro choreography. Beats and durations mirror the dashboard PIN screen so
   the two read as one brand; the copy lives here independently.

     2150  box fades up at .46 scale
     2550  box expands to full, ink recolours over the same 1.2s
     3750  = 2550 + the 1.2s transform transition. These two must stay in
           step: handing off early starts the flight while the box is still
           moving. If the CSS duration changes, change this.
     +1150 the wordmark flies from centre to its resting position and the
           two copies swap. Matches the CSS transition on .landing. */
const _introTimers = [];

function runIntro() {
  _introTimers.splice(0).forEach(clearTimeout);

  const intro = document.getElementById('intro');
  const title = document.querySelector('.intro-title');
  const box   = document.querySelector('.intro-box');
  const canvas= document.querySelector('.intro-canvas');
  if (!intro || !title || !box || !canvas) {
    document.body.classList.remove('intro-running');   // never trap the page
    return;
  }

  // Snap to the hidden start state for one frame before anything animates.
  intro.classList.add('no-anim');
  intro.classList.remove('shot-in', 'shot-full', 'done');
  void intro.offsetWidth;
  intro.classList.remove('no-anim');

  // Split the wordmark into per-character spans. Spaces get their own span
  // (white-space:pre in the CSS) so the cascade stays evenly timed.
  const text = title.textContent;
  title.textContent = '';
  [...text].forEach((ch, i) => {
    const s = document.createElement('span');
    s.className = 'ch';
    s.style.setProperty('--i', String(i));
    s.textContent = ch;
    title.appendChild(s);
  });

  const ground = window.__splashGround || '#1f2b3a';
  const boxColour = window.__splashBox || '#111014';
  canvas.style.background = ground;
  box.style.background = boxColour;

  // All three backdrops are dark, so the ink starts light and only changes
  // when the box expands — to dark ink if this load drew the off-white box.
  const boxIsDark = boxColour === '#111014';
  const landInk = () => intro.classList.toggle('on-dark', boxIsDark);

  const rest = document.querySelector('h1');

  // The page takes its resting layout with the headline present but undrawn.
  // visibility, not opacity or display: the box has to stay measurable, since
  // it is the target the intro wordmark is about to travel to.
  const stagePage = () => {
    rest.style.visibility = 'hidden';
    document.body.classList.remove('intro-running');
  };

  // The two wordmarks trade places. They carry identical type metrics and sit
  // at identical coordinates by now, so there is nothing to see in the swap.
  const handOver = () => {
    rest.style.visibility = '';
    intro.style.display = 'none';
  };

  // The landing. Rather than cross-fading the overlay out and the page in --
  // which reads as the wordmark teleporting from the centre to the margin --
  // the intro wordmark TRAVELS to where the resting one sits and the two swap
  // on arrival. The distance is measured at run time, never hard-coded: both
  // ends are driven by clamp()s and move with the viewport, so any baked-in
  // offset would be wrong at every width but one.
  const land = () => {
    _introTimers.splice(0).forEach(clearTimeout);
    intro.classList.add('shot-in', 'shot-full');
    stagePage();
    const from = title.getBoundingClientRect();
    const to   = rest.getBoundingClientRect();
    intro.classList.add('landing', 'done');
    title.style.transform = `translate(${to.left - from.left}px, ${to.top - from.top}px)`;
    // Ink resolves to the resting colour over the flight: whatever the box
    // was, the page it lands on is cream, so the wordmark arrives dark.
    intro.classList.remove('on-dark');
    // Matches the CSS flight duration. If one changes, change the other.
    _introTimers.push(setTimeout(handOver, 1150));
  };

  // Cutting to the end -- reduced motion, or anything that cannot wait. No
  // flight: the page simply arrives in its resting state.
  const jump = () => {
    _introTimers.splice(0).forEach(clearTimeout);
    intro.classList.add('no-anim', 'shot-in', 'shot-full', 'done');
    intro.classList.remove('on-dark');
    stagePage();
    handOver();
    void intro.offsetWidth;
    intro.classList.remove('no-anim');
  };

  if (matchMedia('(prefers-reduced-motion: reduce)').matches) {
    title.querySelectorAll('.ch').forEach(c => { c.style.animation = 'none'; });
    jump();
    return;
  }

  intro.classList.add('staging', 'on-dark');

  const at = (ms, fn) => _introTimers.push(setTimeout(fn, ms));
  at(2150, () => intro.classList.add('shot-in'));
  at(2550, () => { intro.classList.add('shot-full'); landInk(); });
  at(3750, land);
}

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', runIntro);
} else {
  runIntro();
}
</script>
</body>
</html>
